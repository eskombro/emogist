# VPS deployment: pulls the image published by .github/workflows/deploy.yml.
# The model stays on the VPS in ./models and is mounted read-only.
services:
  emogist:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER must be set}/emogist:latest
    restart: unless-stopped
    init: true
    environment:
      EMOGIST_THREADS: ${EMOGIST_THREADS:-2}
      EMOGIST_WARMUP_HOLD: ${EMOGIST_WARMUP_HOLD:-90}
      EMOGIST_SENTENCE_HOLD: ${EMOGIST_SENTENCE_HOLD:-180}
      # Read from the host, so the model won't load when other services need the RAM.
      EMOGIST_MIN_AVAILABLE_GB: ${EMOGIST_MIN_AVAILABLE_GB:-3}
    volumes:
      - ./models:/models:ro
    # Loopback only: the host's Caddy is the only way in.
    ports:
      - "127.0.0.1:${EMOGIST_PORT:-8010}:8000"
    # If memory runs out, this demo is stopped before the other services on the VPS.
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2
    oom_score_adj: 500
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /status never loads the model.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
