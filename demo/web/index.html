<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#272230">
<meta name="description" content="Turn an everyday English, French or Spanish sentence into emojis that keep the gist.">
<title>Emogist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
  :root {
    color-scheme: dark;
    /* Calm dark palette: a plum page, slightly lighter plum boxes, one muted violet for actions
       and a soft lilac for links and highlights. */
    --bg: #272230; --on-bg: #eeeaf4; --on-bg-muted: #b8afc7; --on-bg-line: rgb(238 234 244 / 0.12);
    --panel: #332d3e; --soft: #3e3749; --text: #eeeaf4; --muted: #b8afc7; --line: #463f52;
    --brand: #6f58b0; --brand-hover: #5d4899; --highlight: #cbbdf0; --tooltip: #1d1924; --knob: #eeeaf4;    /* Emojis sit on light chips: dark emojis such as 🔙 or 🎩 would vanish on the dark boxes. */
    --chip: #8f82a3; --chip-line: #7a6d8e; --chip-mark: #2f2938;
    --brand-ink: #cbbdf0; --error: #f29bb8; --error-soft: #4d2c3c;
    --accent: var(--brand); --accent-text: #ffffff;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 32px 16px 48px; background: var(--bg); color: var(--on-bg);
    font: 16px/1.5 Arvo, Rockwell, Georgia, serif;
  }
  form, .result, .guide { color: var(--text); }
  :focus-visible { outline: 2px solid var(--highlight); outline-offset: 2px; }
  form :focus-visible, .result :focus-visible, .guide :focus-visible { outline-color: var(--brand-ink); }
  .emojis, .chips, .symbol { font-family: var(--emoji); }
  main { width: 100%; max-width: 680px; margin: 0 auto; transition: max-width 0.2s ease; }
  body.comparing main { max-width: 820px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; color: var(--on-bg); }
  /* Only the word gets the gradient: a clipped background would hide the emoji. */
  .title-word { color: var(--highlight); background: linear-gradient(90deg, #cbbdf0, #f29bb8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .title-emoji { font-family: var(--emoji); font-size: 0.85em; }
  h2 { margin: 0 0 6px; font-size: 1.25rem; letter-spacing: -0.01em; }
  .header-side { display: flex; align-items: center; gap: 14px; }
  .about-link { color: var(--highlight); font-size: 0.9375rem; font-weight: 600; text-underline-offset: 2px; }
  .intro { margin: 10px 0 24px; color: var(--on-bg-muted); }

  .language { position: relative; display: inline-grid; grid-template-columns: repeat(3, 1fr); flex: none; padding: 3px; background: rgb(248 245 255 / 0.08); border: 1px solid var(--on-bg-line); border-radius: 999px; }
  .language::before {
    content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3);
    background: var(--panel); border-radius: 999px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.2); transition: transform 0.18s ease;
  }
  html[lang="fr"] .language::before { transform: translateX(100%); }
  html[lang="es"] .language::before { transform: translateX(200%); }
  .language button {
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-width: 62px; min-height: 34px; padding: 0 9px; color: var(--on-bg-muted); background: transparent;
    border: 0; border-radius: 999px; font: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer;
  }
  .language button[aria-pressed="true"] { color: var(--text); }
  .language.busy button { cursor: wait; }
  .language svg { display: block; width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.14); }

  form, .result, .guide { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: 0 4px 16px rgb(0 0 0 / 0.22); }
  label { display: block; margin-bottom: 8px; font-weight: 600; }
  /* Titles above the boxes, on the dark page. */
  .section-title { display: block; margin: 0 0 8px; scroll-margin-top: 12px; color: var(--on-bg); font-size: 1.0625rem; font-weight: 700; letter-spacing: 0; }
  .results-title { margin-top: 24px; scroll-margin-top: 12px; }
  textarea {
    display: block; width: 100%; min-height: 92px; padding: 10px 12px; resize: vertical;
    color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; font: inherit;
  }
  .switch input:focus-visible + .track { outline: 2px solid var(--brand-ink); outline-offset: 2px; }
  /* The counter has its own line: on the buttons' line its changing width made them jump. */
  .count-row { display: flex; justify-content: flex-end; margin-top: 4px; }
  .count { color: var(--muted); font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
  .actions { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; margin-top: 6px; }
  /* Narrow screens: the switch on one line, both buttons sharing the next one, always. */
  @media (max-width: 640px) {
    .actions { flex-direction: column; align-items: stretch; }
    .buttons button { flex: 1; }
  }
  .switch { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: 0.875rem; font-weight: 400; color: var(--muted); cursor: pointer; }
  /* Shown under a trained-only result: runs the untrained model on the same sentence. */
  .nudge {
    display: block; margin: 12px auto 0; min-height: 40px; padding: 0 16px; color: var(--highlight); background: transparent;
    border: 1px dashed var(--chip-line); border-radius: 999px; font: inherit; font-size: 0.9375rem; font-weight: 600; cursor: pointer;
    transition: background-color 0.12s ease, border-color 0.12s ease;
  }
  .nudge:hover { background: var(--soft); border-color: var(--highlight); border-style: solid; }
  .nudge[hidden] { display: none; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  /* Off: a light track (3.7:1 on the panel). On: the brand colour with a lilac ring, so both states stand out. */
  .track { position: relative; flex: none; width: 44px; height: 24px; background: var(--chip); border-radius: 999px; transition: background-color 0.15s ease, box-shadow 0.15s ease; }
  .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: var(--knob); border-radius: 50%; box-shadow: 0 1px 3px rgb(0 0 0 / 0.4); transition: transform 0.15s ease; }
  .switch:hover input:not(:disabled) + .track { box-shadow: 0 0 0 2px var(--chip-line); }
  .switch input:checked + .track { background: var(--accent); box-shadow: 0 0 0 2px var(--highlight); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:disabled + .track { opacity: 0.55; }
  #send {
    min-height: 40px; padding: 0 18px; color: var(--accent-text); background: var(--accent);
    border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; transition: background-color 0.12s ease;
  }
  #send:hover:not(:disabled) { background: var(--brand-hover); }
  #send:disabled { opacity: 0.55; cursor: default; }
  .buttons { display: flex; flex: none; gap: 8px; }
  .compare-wrap { display: flex; align-items: center; gap: 8px; }
  /* A small "i" next to the compare switch; its explanation shows on hover, focus or tap. */
  .info {
    position: relative; display: inline-flex; flex: none; align-items: center; justify-content: center;
    width: 18px; height: 18px; color: var(--muted); border: 1px solid var(--muted); border-radius: 50%;
    font: italic 700 0.75rem/1 Georgia, serif; cursor: help; outline: none;
  }
  .info:focus-visible { border-color: var(--brand); color: var(--brand-ink); }
  .info::after {
    content: attr(data-tip); position: absolute; z-index: 5; bottom: calc(100% + 8px); left: 50%;
    width: max-content; max-width: min(260px, 80vw); padding: 6px 9px; color: var(--highlight); background: var(--tooltip);
    border-radius: 6px; font: 600 0.8125rem/1.35 Arvo, Rockwell, Georgia, serif; font-style: normal; white-space: normal; text-align: left;
    opacity: 0; pointer-events: none; transform: translate(-50%, 3px); transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .info:hover::after, .info:focus::after { opacity: 1; transform: translate(-50%, 0); }
  .compare-banner {
    margin: 12px 0 0; padding: 12px 14px; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--brand); border-radius: 10px; font-size: 0.875rem; line-height: 1.5;
  }
  .compare-banner[hidden] { display: none; }
  .banner-title { display: block; margin-bottom: 4px; color: var(--text); font-size: 0.9375rem; font-weight: 700; }
  .compare-banner strong:not(.banner-title) { color: var(--text); font-weight: 700; white-space: nowrap; }
  #random {
    min-height: 40px; padding: 0 14px; color: var(--text); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
    transition: background-color 0.12s ease, border-color 0.12s ease;
  }
  #random:hover:not(:disabled) { background: var(--soft); border-color: var(--brand); }
  #random:disabled { opacity: 0.55; cursor: default; }

  .results { display: grid; gap: 12px; }
  body.comparing .results { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .result { position: relative; display: flex; flex-direction: column; min-height: 104px; }
  .result[hidden] { display: none; }
  .card-head { display: none; min-height: 32px; margin-bottom: 8px; text-align: left; }
  body.comparing .card-head { display: flex; align-items: center; }
  .card-name { font-weight: 700; }
  .card-body { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; }
  /* Compare mode: name, result right under it, then a separator above the time and tokens line,
     pushed to the bottom so the separators line up across the cards. */
  body.comparing .card-body { flex: none; justify-content: flex-start; text-align: left; }
  body.comparing .card-body .emojis { justify-content: flex-start; }
  body.comparing .card-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }
  body.comparing .card-body { margin-bottom: 14px; }
  body.comparing .details { text-align: left; margin-top: 4px; }
  body.comparing .result:has(.tools:not([hidden])) { padding-top: 16px; }
  body.comparing .tools { top: 16px; right: 12px; }
  .emojis { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; font-size: 1.75rem; line-height: 1.2; }
  body.comparing .emojis { gap: 6px; font-size: 1.375rem; }
  .emojis:empty { display: none; }
  .emojis.placeholder { opacity: 0.4; }
  .emojis.placeholder .chip, .emojis.placeholder .arrow { animation: none; }
  .raw { margin: 0; color: var(--muted); font-size: 0.9375rem; overflow-wrap: anywhere; }
  .raw:empty { display: none; }
  .tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; }
  .tools[hidden] { display: none; }
  .result:has(.tools:not([hidden])) { padding-top: 44px; }
  .tool {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
    color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 8px; cursor: pointer;
    font: inherit; font-size: 0.8125rem; font-weight: 600;
    transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .tool:hover { color: var(--text); background: var(--soft); border-color: var(--line); }
  .tool[hidden] { display: none; }
  .tool svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tool .done, .tool.copied .idle { display: none; }
  .tool.copied .done { display: block; }
  .tool.copied { color: var(--brand-ink); }
  .chip { display: inline-block; max-width: 100%; padding: 6px 10px; background: var(--chip); border: 1px solid var(--chip-line); border-radius: 10px; overflow-wrap: anywhere; animation: pop 0.22s cubic-bezier(0.3, 1.5, 0.6, 1); }
  .arrow { display: inline-block; animation: pop 0.22s cubic-bezier(0.3, 1.5, 0.6, 1); }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  .sign { position: relative; border-bottom: 2px dotted var(--chip-mark); cursor: help; outline: none; }
  .arrow.sign { border-bottom-color: var(--muted); }
  .sign:focus-visible { border-bottom-color: var(--brand); }
  .sign::after {
    content: attr(data-tip); position: absolute; z-index: 5; bottom: calc(100% + 8px); left: 50%;
    padding: 4px 8px; color: var(--highlight); background: var(--tooltip); border-radius: 6px;
    font: 600 0.8125rem/1.3 Arvo, Rockwell, Georgia, serif; white-space: nowrap;
    opacity: 0; pointer-events: none; transform: translate(-50%, 3px); transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .sign:hover::after, .sign:focus::after { opacity: 1; transform: translate(-50%, 0); }
  .message { color: var(--muted); }
  .message.error { color: var(--error); }
  .message:empty { display: none; }
  .details { margin-top: 8px; color: var(--muted); font-size: 0.8125rem; font-style: italic; font-variant-numeric: tabular-nums; text-align: right; }
  .details:empty { display: none; }
  .tag { display: inline-block; margin-right: 6px; padding: 0 6px; color: var(--error); background: var(--error-soft); font-style: normal; font-weight: 600; border-radius: 6px; }
  .spinner { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .guide { margin-top: 32px; padding: 0; }
  .guide summary {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 56px; padding: 12px 16px; border-radius: 12px; cursor: pointer; list-style: none;
  }
  .guide summary::-webkit-details-marker { display: none; }
  .guide summary::after {
    content: ""; flex: none; width: 9px; height: 9px; margin-right: 4px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-2px) rotate(45deg); transition: transform 0.18s ease;
  }
  .guide[open] summary::after { transform: translateY(2px) rotate(225deg); }
  .guide h2 { margin: 0; }
  .guide-body { padding: 0 16px 16px; }
  .guide-body > p { margin: 0 0 14px; color: var(--muted); font-size: 0.9375rem; }
  .rules { display: grid; margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .rules li { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .symbol { grid-row: span 2; align-self: start; justify-self: start; padding: 2px 8px; font-size: 1.25rem; line-height: 1.5; max-width: 100%; box-sizing: border-box; overflow-wrap: anywhere; background: var(--chip); border-radius: 8px; }
  .rule { font-weight: 600; }
  .sample { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; color: var(--muted); font-size: 0.9375rem; overflow-wrap: anywhere; }
  .chips { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; color: var(--text); font-size: 1rem; line-height: 1.2; }
  .chips .chip { padding: 2px 6px; border-radius: 6px; animation: none; }
  .chips .arrow { animation: none; }
  .boxes { display: inline-flex; gap: 4px; padding-top: 5px; }
  .boxes span { width: 22px; height: 18px; background: var(--soft); border: 1px solid var(--muted); border-radius: 5px; }
  .note { margin: 14px 0 0 !important; font-size: 0.875rem !important; }
  footer { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--on-bg-line); color: var(--on-bg-muted); font-size: 0.875rem; }
  footer p { flex: 1 1 280px; margin: 0; }
  .footer-links { display: flex; gap: 16px; }
  footer a { display: inline-flex; flex: none; align-items: center; gap: 6px; color: var(--highlight); font-weight: 600; text-underline-offset: 2px; }
  footer a svg { flex: none; width: 16px; height: 16px; fill: currentColor; }
  @media (max-width: 760px) {
    body.comparing .results { grid-template-columns: minmax(0, 1fr); }
  }
  /* Phones, including the larger ones about 430px wide: a narrower symbol column, smaller symbols. */
  @media (max-width: 480px) {
    .rules li { grid-template-columns: 62px minmax(0, 1fr); gap: 2px 8px; }
    .symbol { font-size: 1rem; }
  }
  @media (max-width: 420px) {
    h1 { font-size: 1.75rem; }
    .language button { min-width: 54px; padding: 0 6px; }
    .emojis { gap: 6px; font-size: 1.375rem; }
    .chip { padding: 5px 7px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner, .chip, .arrow { animation: none; }
    main, .language::before, .guide summary::after, .track, .track::after, .sign::after { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><span class="title-word">Emogist</span> <span class="title-emoji" aria-hidden="true">🤩</span></h1>
    <div class="header-side">
      <a class="about-link" href="/about" data-t="about"></a>
      <div class="language" role="group" id="language">
        <button type="button" data-lang="en" aria-label="English">
          <svg viewBox="0 0 60 60" aria-hidden="true"><clipPath id="uk"><circle cx="30" cy="30" r="30"/></clipPath><g clip-path="url(#uk)"><rect width="60" height="60" fill="#012169"/><path d="M0 0 60 60M60 0 0 60" stroke="#fff" stroke-width="12"/><path d="M0 0 60 60M60 0 0 60" stroke="#c8102e" stroke-width="5"/><path d="M30 0V60M0 30H60" stroke="#fff" stroke-width="20"/><path d="M30 0V60M0 30H60" stroke="#c8102e" stroke-width="12"/></g></svg>
          EN
        </button>
        <button type="button" data-lang="fr" aria-label="Français">
          <svg viewBox="0 0 60 60" aria-hidden="true"><clipPath id="fr"><circle cx="30" cy="30" r="30"/></clipPath><g clip-path="url(#fr)"><rect width="20" height="60" fill="#002395"/><rect x="20" width="20" height="60" fill="#fff"/><rect x="40" width="20" height="60" fill="#ed2939"/></g></svg>
          FR
        </button>
        <button type="button" data-lang="es" aria-label="Español">
          <svg viewBox="0 0 60 60" aria-hidden="true"><clipPath id="es"><circle cx="30" cy="30" r="30"/></clipPath><g clip-path="url(#es)"><rect width="60" height="60" fill="#c60b1e"/><rect y="15" width="60" height="30" fill="#ffc400"/></g></svg>
          ES
        </button>
      </div>
    </div>
  </header>
  <p class="intro" data-t="intro"></p>
  <label class="section-title" for="sentence" data-t="label"></label>
  <form id="form">
    <textarea id="sentence" maxlength="200"></textarea>
    <div class="count-row"><span class="count" id="count">0 / 200</span></div>
    <div class="actions">
      <div class="compare-wrap">
        <label class="switch">
          <input type="checkbox" id="compare">
          <span class="track" aria-hidden="true"></span>
          <span data-t="compare"></span>
        </label>
        <span class="info" id="compare-info" tabindex="0" role="note">i</span>
      </div>
      <div class="buttons">
        <button type="button" id="random" data-t="random"></button>
        <button type="submit" id="send" data-t="send"></button>
      </div>
    </div>
  </form>

  <h2 class="section-title results-title" id="results-title" data-t="resultTitle"></h2>
  <section class="results" id="results" aria-live="polite" aria-labelledby="results-title"></section>
  <button type="button" class="nudge" id="try-untrained" data-t="tryUntrained" hidden></button>
  <p class="compare-banner" id="compare-banner" hidden></p>

  <details class="guide">
    <summary><h2 data-t="guideTitle"></h2></summary>
    <div class="guide-body">
      <p data-t="guideIntro"></p>
      <ul class="rules" id="rules"></ul>
      <p class="note" data-t="guideNote"></p>
    </div>
  </details>
  <footer>
    <p data-t="footer"></p>
    <div class="footer-links">
      <a href="/about" data-t="about"></a>
      <a href="https://github.com/eskombro/emogist" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span data-t="github"></span>
      </a>
    </div>
  </footer>
</main>

<template id="card">
  <article class="result">
    <div class="card-head"><div class="card-name"></div></div>
    <div class="card-body">
      <div>
        <div class="emojis" translate="no"></div>
        <p class="raw"></p>
        <div class="message"></div>
      </div>
    </div>
    <div class="card-foot">
      <div class="details"></div>
    </div>

      area.value = value;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.append(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }
  }

  async function flash(button, value) {
    if (!value) return;
    await toClipboard(value);
    const text = TEXT[language];
    button.classList.add("copied");
    button.querySelector(".label").textContent = button.classList.contains("share") ? text.shareDone : text.copied;
    clearTimeout(button.timer);
    button.timer = setTimeout(() => { button.classList.remove("copied"); renderAll(); }, 1500);
  }

  // A share link holds only the sentence, after the #, which browsers never send to the server.
  // Opening it runs the model again: answers are deterministic, so the visitor sees the same emojis.
  function shareLink(sentence) {
    return `${location.origin}${location.pathname}#${new URLSearchParams({ s: sentence })}`;
  }

  function readShareLink() {
    const sentence = (new URLSearchParams(location.hash.slice(1)).get("s") || "").trim();
    return sentence && sentence.length <= 200 ? sentence : null;
  }

  function savedLanguage() {
    try {
      const saved = localStorage.getItem("emogist-language");
      if (saved in TEXT) return saved;
    } catch {}
    const browser = (navigator.languages || [navigator.language]).find(Boolean)?.toLowerCase() || "";
    return ["fr", "es"].find(code => browser.startsWith(code)) || "en";
  }

  function setLanguage(next, remember = true) {
    language = next;
    const text = TEXT[language];
    document.documentElement.lang = language;
    document.querySelectorAll("[data-t]").forEach(element => { element.textContent = text[element.dataset.t]; });
    box.placeholder = text.placeholder;
    randomButton.title = text.randomTitle;
    const info = document.getElementById("compare-info");
    info.dataset.tip = text.compareInfo;
    info.setAttribute("aria-label", text.compareInfo);
    switcher.setAttribute("aria-label", text.languageLabel);
    switcher.querySelectorAll("button").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.lang === language)));
    rules.replaceChildren(...RULES.map((rule, index) => {
      const [title, meaning] = text.rules[index];
      const item = document.createElement("li");
      const symbol = document.createElement("div");
      symbol.className = "symbol";
      symbol.translate = false;
      symbol.setAttribute("aria-hidden", "true");
      if (rule.symbol === "boxes") {
        const boxes = document.createElement("span");
        boxes.className = "boxes";
        boxes.append(document.createElement("span"), document.createElement("span"));
        symbol.append(boxes);
      } else {
        symbol.textContent = rule.symbol;
      }
      const name = document.createElement("div");
      name.className = "rule";
      name.textContent = title;
      const sample = document.createElement("div");
      sample.className = "sample";
      const emoji = document.createElement("span");
      emoji.className = "chips";
      emoji.translate = false;
      drawEmojis(emoji, rule.sample);
      const explanation = document.createElement("span");
      explanation.textContent = meaning;
      sample.append(emoji, explanation);
      item.append(symbol, name, sample);
      return item;
    }));
    renderAll();
    if (remember) {
      try { localStorage.setItem("emogist-language", language); } catch {}
    }
  }

  function updateCount() { count.textContent = `${box.value.length} / 200`; }

  function warmup() {
    if (Date.now() - lastWarmup < 60000) return;
    lastWarmup = Date.now();
    fetch(API + "/warmup", { method: "POST" }).catch(() => {});
  }

  async function watchLoading(card, isDone) {
    while (!isDone()) {
      try {
        const { state } = await (await fetch(API + "/status")).json();
        if (isDone()) return;
        card.state.status = state === "ready" ? "translating" : "waking";
        renderCard(card);
      } catch { return; }
      await new Promise(resolve => setTimeout(resolve, 500));
    }
  }

  async function runModel(card, sentence) {
    card.state = { phase: "loading", status: "translating" };
    renderCard(card);
    let started = false;
    let finished = false;
    let output = "";
    const fail = code => { finished = true; card.state = { phase: "error", code }; renderCard(card); };
    const handle = data => {
      if (data.type === "piece") {
        started = true;
        output += data.text;
        card.state = { phase: "streaming", text: output };
        renderCard(card);
      } else if (data.type === "done") {
        finished = true;
        card.state = { phase: "done", text: data.emojis, valid: data.valid, tokens: data.tokens, seconds: data.seconds };
        renderCard(card);
      } else if (data.type === "error") {
        fail(data.code);
      }
    };
    watchLoading(card, () => started || finished);
    try {
      const response = await fetch(API + "/emoji/stream", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sentence, model: card.model }),
      });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        fail(data.code);
        return;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (!finished) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const events = buffer.split("\n\n");
        buffer = events.pop();
        events.filter(line => line.startsWith("data: ")).forEach(line => handle(JSON.parse(line.slice(6))));
      }
      if (!finished) fail("network");
    } catch {
      fail("network");
    }
  }

  // Empties every result box (and the faded placeholder) before a new sentence runs.
  function clearResults() {
    showingPlaceholder = false;
    for (const card of Object.values(cards)) card.state = { phase: "idle" };
    renderAll();
  }

  async function translate({ reveal = true } = {}) {
    const sentence = box.value.trim();
    clearResults();
    if (shared && sentence !== shared) { shared = null; history.replaceState(null, "", location.pathname); }
    const models = compareBox.checked ? MODELS : ["v2"];
    if (!sentence) {
      cards.v2.state = { phase: "error", code: "empty" };
      renderAll();
      box.focus();
      return;
    }
    lastSentence = sentence;
    if (reveal) revealResults();
    await runModels(models, sentence);
  }

  async function runModels(models, sentence) {
    running = true;
    send.disabled = randomButton.disabled = compareBox.disabled = true;
    switcher.classList.add("busy");
    results.setAttribute("aria-busy", "true");
    for (const model of models) cards[model].state = { phase: "waiting" };
    renderAll();
    try {
      for (const model of models) await runModel(cards[model], sentence);
    } finally {
      results.removeAttribute("aria-busy");
      running = false;
      send.disabled = randomButton.disabled = compareBox.disabled = false;
      switcher.classList.remove("busy");
      renderNudge();
    }
  }

  // The button under a trained-only result: it turns compare on and runs just the untrained model
  // on the same sentence, so the trained answer stays and isn't computed twice.
  const nudge = document.getElementById("try-untrained");

  function renderNudge() {
    nudge.hidden = running || compareBox.checked || cards.v2.state.phase !== "done" || box.value.trim() !== lastSentence;
  }

  nudge.addEventListener("click", () => {
    if (running) return;
    compareBox.checked = true;
    renderAll();
    revealResults();
    runModels(["base"], lastSentence);
  });

  // Scrolling when Translate or Random starts.
  // Small screens (one column, the same breakpoint as the CSS): always bring "Your sentence" to the
  // top, so the sentence and the boxes under it are in view, unless it's already there.
  // Wide screens: the result boxes usually show already; the page only moves when they don't.
  const ONE_COLUMN = "(max-width: 760px)";
  const smoothScroll = () => !window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
  const goTo = element => element.scrollIntoView({ behavior: smoothScroll() ? "smooth" : "auto", block: "start" });
  const sentenceLabel = () => document.querySelector("label.section-title");
  const oneColumn = () => window.matchMedia?.(ONE_COLUMN).matches;

  function revealSentence() {
    const top = sentenceLabel().getBoundingClientRect().top;
    const nearTop = oneColumn() ? top >= 0 && top <= 60 : top >= 0 && top <= window.innerHeight * 0.4;
    if (!nearTop) goTo(sentenceLabel());
  }

  function revealResults() {
    if (oneColumn()) { revealSentence(); return; }
    if (compareBox.checked) {
      const title = document.getElementById("results-title");
      const top = title.getBoundingClientRect().top;
      if (top < 0 || top > window.innerHeight * 0.6) goTo(title);
      return;
    }
    const card = cards.v2.element.getBoundingClientRect();
    if (card.top < 0 || card.bottom > window.innerHeight) goTo(sentenceLabel());
  }

  // Random button: the sentences of the page language (random.json, loaded on first use) are put in
  // a shuffled order, and each click takes the next one, so nothing repeats until all have been
  // shown. Then the list is shuffled again, never starting with the sentence just shown.
  let randomSentences = null;
  const randomQueues = {};   // language -> { order, next }

  function shuffled(list) {
    const copy = [...list];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function nextRandomSentence() {
    const all = randomSentences[language] || [];
    if (!all.length) return null;
    let queue = randomQueues[language];
    if (!queue || queue.next >= queue.order.length) {
      const last = queue?.order.at(-1);
      const order = shuffled(all);
      if (order.length > 1 && order[0] === last) order.push(order.shift());
      queue = randomQueues[language] = { order, next: 0 };
    }
    return queue.order[queue.next++];
  }

  async function translateRandom() {
    if (running) return;
    clearResults();
    warmup();
    try {
      randomSentences ||= await (await fetch(API + "/random.json")).json();
    } catch {
      cards.v2.state = { phase: "error", code: "network" };
      renderAll();
      return;
    }
    const sentence = nextRandomSentence();
    if (!sentence) return;
    revealSentence();
    await typeSentence(sentence);
    translate({ reveal: false });
  }

  // Writes the sentence into the box as if someone were typing it, in about one second whatever its
  // length. The buttons stay disabled meanwhile; with reduced motion it appears at once.
  async function typeSentence(sentence) {
    if (window.matchMedia?.("(prefers-reduced-motion: reduce)").matches) {
      box.value = sentence;
      updateCount();
      return;
    }
    running = true;
    send.disabled = randomButton.disabled = compareBox.disabled = true;
    switcher.classList.add("busy");
    try {
      const letters = graphemes(sentence);
      const delay = Math.min(40, 1000 / letters.length);
      box.value = "";
      for (const letter of letters) {
        box.value += letter;
        updateCount();
        await new Promise(resolve => setTimeout(resolve, delay));
      }
    } finally {
      running = false;
      send.disabled = randomButton.disabled = compareBox.disabled = false;
      switcher.classList.remove("busy");
    }
  }

  // Switching language starts afresh: empty sentence, empty results, the faded placeholder back.
  // While a sentence is still running, the switch waits until it has finished.
  switcher.addEventListener("click", event => {
    const button = event.target.closest("button");
    if (!button || button.dataset.lang === language || running) return;
    box.value = "";
    updateCount();
    if (shared) { shared = null; history.replaceState(null, "", location.pathname); }
    for (const card of Object.values(cards)) card.state = { phase: "idle" };
    showingPlaceholder = true;
    setLanguage(button.dataset.lang);
  });
  // Turning compare on after a trained-only result runs the untrained model on that same sentence,
  // so its card isn't left empty. A result it already has (compare turned off, then on) is kept.
  compareBox.addEventListener("change", () => {
    renderAll();
    if (running || !compareBox.checked || cards.v2.state.phase !== "done" || cards.base.state.phase !== "idle") return;
    revealResults();
    runModels(["base"], lastSentence);
  });
  box.addEventListener("focus", warmup);
  box.addEventListener("input", () => { updateCount(); renderNudge(); });
  box.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); if (!running) translate(); }
  });
  form.addEventListener("submit", event => { event.preventDefault(); if (!running) translate(); });
  randomButton.addEventListener("click", translateRandom);

  shared = readShareLink();
  if (shared) box.value = shared;
  updateCount();
  setLanguage(savedLanguage(), false);
  if (shared) { warmup(); translate(); }
</script>
</body>
</html>
